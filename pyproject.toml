[project]
name = "llmwiki-service"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = ["sqlite-vec", "starlette", "uvicorn"]

[project.optional-dependencies]
dev = ["mutmut"]

[tool.hatch.build.targets.wheel]
packages = ["llmwiki_service", "skills/llm-wiki/llmwiki"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["llmwiki_service"]
only_mutate = ["llmwiki_service/auth.py", "llmwiki_service/tokens.py", "llmwiki_service/deployment.py", "llmwiki_service/app.py", "llmwiki_service/tls.py", "llmwiki_service/routes.py", "llmwiki_service/admin.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_service_auth.py",
    "tests/test_service_tokens.py",
    "tests/test_service_deployment.py",
    "tests/test_service_app.py",
    "tests/test_service_tls.py",
    "tests/test_service_routes.py",
    "tests/test_service_admin.py",
]
also_copy = ["skills/llm-wiki/llmwiki"]
