[project]
name = "llmwiki"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["sqlite-vec"]

[project.scripts]
llmwiki = "llmwiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
source_paths = ["llmwiki_service"]
only_mutate = ["llmwiki_service/auth.py", "llmwiki_service/tokens.py", "llmwiki_service/deployment.py", "llmwiki_service/app.py", "llmwiki_service/tls.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_service_auth.py",
    "tests/test_service_tokens.py",
    "tests/test_service_deployment.py",
    "tests/test_service_app.py",
    "tests/test_service_tls.py",
]
also_copy = ["llmwiki"]
